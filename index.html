<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=home/">
  <title>ARIA Solutions — Segurança Eletrônica & Controle de Acesso</title>
  <script>
    window.location.replace("home/");
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #061F13;
      color: #FFFFFF;
      text-align: center;
    }
    .loader-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 16px;
      max-width: 400px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #10B981;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 10px; font-weight: 700;">ARIA Solutions</h2>
    <p style="color: #94a3b8; font-size: 0.95rem; margin: 0 0 16px;">Carregando a página inicial...</p>
    <p style="font-size: 0.85rem;"><a href="home/">Clique aqui caso não seja redirecionado automaticamente</a></p>
  </div>
</body>
</html>
